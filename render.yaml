# Render Blueprint：在 Render 選 New → Blueprint 並連到這個 repo，會自動建立服務
services:
  - type: web
    name: shopee-line-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # 股票分析要抓多個網站，約需 5–10 秒（開 AI 研判會更久），所以把逾時拉長
    startCommand: gunicorn app:app --timeout 120 --workers 2 --threads 4
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

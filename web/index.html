<title>柏君投資訊號</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&display=swap">
<style>
/* Layout: 交易看盤台——頂部查詢列，摘要（股價｜訊號儀表）並排，下方依序圖表、因素拆解、新聞三欄 */
:root {
  --bg: #f3f5f8;
  --surface: #ffffff;
  --sunken: #eaedf2;
  --ink: #121720;
  --ink-2: #485263;
  --muted: #747e8e;
  --line: #dce1e8;
  --accent: #2554c7;
  --accent-ink: #ffffff;
  /* 台股慣例：紅漲綠跌 */
  --up: #cf3434;
  --up-soft: #fbe5e4;
  --down: #0d8048;
  --down-soft: #dff3e8;
  --flat: #8a93a2;
  --series-1: #2a78d6;
  --series-2: #eb6834;
  --series-3: #1baf7a;
  --font-display: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
  --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1116; --surface: #161a21; --sunken: #1d222b; --ink: #edf0f5; --ink-2: #aeb6c3;
    --muted: #7e8898; --line: #2a303a; --accent: #6f95ff; --accent-ink: #0b1020;
    --up: #f06767; --up-soft: #3a1d1f; --down: #34c27f; --down-soft: #15301f; --flat: #7e8898;
    --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1116; --surface: #161a21; --sunken: #1d222b; --ink: #edf0f5; --ink-2: #aeb6c3;
  --muted: #7e8898; --line: #2a303a; --accent: #6f95ff; --accent-ink: #0b1020;
  --up: #f06767; --up-soft: #3a1d1f; --down: #34c27f; --down-soft: #15301f; --flat: #7e8898;
  --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.6; }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 20px; padding-block: 20px 48px; display: grid; gap: 20px; }
@media (max-width: 520px) { .wrap { padding-inline: 16px; } }
.num { font-family: var(--font-data); font-variant-numeric: tabular-nums; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* 頂部 */
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px; }
.brand { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; }
.brand h1 { font-family: var(--font-display); font-weight: 900; font-size: 22px; letter-spacing: .02em; white-space: nowrap; }
.brand span { color: var(--muted); font-size: 13px; }
.search { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.search form { display: flex; gap: 8px; }
.search input { width: 150px; font: 500 15px var(--font-data); padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); text-transform: uppercase; }
.search input::placeholder { text-transform: none; font-family: var(--font-body); color: var(--muted); }
.btn { font: 500 14px var(--font-body); padding: 8px 16px; border-radius: 8px; border: 0; background: var(--accent); color: var(--accent-ink); cursor: pointer; }
.btn:disabled { opacity: .55; cursor: progress; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: 500 13px var(--font-data); padding: 5px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); cursor: pointer; }
.chip[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
.chip small { font-family: var(--font-body); margin-left: 4px; color: var(--muted); }

.banner { font-size: 13px; color: var(--ink-2); background: var(--sunken); border-radius: 8px; padding: 8px 12px; }
.status { font-size: 14px; color: var(--ink-2); display: flex; align-items: center; gap: 10px; }
.status.error { color: var(--up); }
.spinner { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--accent); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
main[aria-busy="true"] .report { opacity: .45; transition: opacity .2s; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; min-width: 0; }
.panel h2 { font-size: 15px; font-weight: 700; display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.panel h2 small { font-weight: 400; color: var(--muted); font-size: 12px; }
.label { font-size: 12px; letter-spacing: .08em; color: var(--muted); }
.report { display: grid; gap: 20px; }

/* 摘要 */
.summary { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 20px; }
@media (max-width: 860px) { .summary { grid-template-columns: 1fr; } }
.quote { display: grid; gap: 14px; align-content: start; }
.quote .name { font-family: var(--font-display); font-weight: 700; font-size: 24px; line-height: 1.25; }
.quote .sym { color: var(--muted); font-size: 13px; }
.price-row { display: flex; align-items: baseline; flex-wrap: wrap; gap: 6px 14px; }
.price { font-size: 40px; font-weight: 600; letter-spacing: -.02em; line-height: 1; }
.ccy { color: var(--muted); font-size: 13px; }
.chg { font-size: 16px; font-weight: 600; }
.up { color: var(--up); } .down { color: var(--down); } .flat { color: var(--flat); }
.range { display: grid; gap: 4px; }
.range-track { position: relative; height: 6px; border-radius: 3px; background: var(--sunken); }
.range-dot { position: absolute; top: 50%; width: 12px; height: 12px; border-radius: 50%; background: var(--ink); border: 2px solid var(--surface); transform: translate(-50%, -50%); }
.range-ends { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }

.signal { display: grid; gap: 16px; align-content: start; }
.signal-head { display: flex; align-items: center; flex-wrap: wrap; gap: 10px 16px; }
.score { font-size: 48px; font-weight: 600; line-height: 1; letter-spacing: -.03em; }
.score small { font-size: 16px; color: var(--muted); font-weight: 400; letter-spacing: 0; }
.verdict { font-family: var(--font-display); font-weight: 900; font-size: 22px; padding: 4px 14px; border-radius: 8px; }
.verdict.buy { background: var(--up-soft); color: var(--up); }
.verdict.sell { background: var(--down-soft); color: var(--down); }
.verdict.hold { background: var(--sunken); color: var(--ink-2); }
.gauge { display: grid; gap: 6px; }
.gauge-bar { position: relative; display: grid; grid-template-columns: 60fr 25fr 30fr 25fr 60fr; gap: 2px; height: 10px; }
.gauge-bar i { display: block; border-radius: 2px; }
.gauge-bar i:nth-child(1) { background: var(--down); }
.gauge-bar i:nth-child(2) { background: var(--down); opacity: .45; }
.gauge-bar i:nth-child(3) { background: var(--flat); opacity: .35; }
.gauge-bar i:nth-child(4) { background: var(--up); opacity: .45; }
.gauge-bar i:nth-child(5) { background: var(--up); }
.gauge-needle { position: absolute; top: -6px; width: 3px; height: 22px; border-radius: 2px; background: var(--ink); transform: translateX(-50%); box-shadow: 0 0 0 2px var(--surface); }
.gauge-zones { display: grid; grid-template-columns: 60fr 25fr 30fr 25fr 60fr; font-size: 12px; color: var(--muted); text-align: center; }
.gauge-ticks { position: relative; height: 16px; font-size: 11px; color: var(--muted); }
.gauge-ticks span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
.gauge-ticks span:first-child { transform: none; }
.gauge-ticks span:last-child { transform: translateX(-100%); }
@media (max-width: 520px) { .gauge-zones { font-size: 11px; } .gauge-ticks span:nth-child(2), .gauge-ticks span:nth-child(6) { display: none; } }
.signal p { margin: 0; font-size: 13px; color: var(--ink-2); }

/* 價格圖 */
.chart-box { position: relative; margin-top: 12px; }
.chart-box svg { display: block; width: 100%; height: auto; overflow: visible; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 2px; border-radius: 1px; display: inline-block; }
.tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 12px; box-shadow: 0 4px 16px rgb(0 0 0 / .12); min-width: 140px; display: grid; gap: 2px; }
.tip b { font-weight: 600; }
.tip div { display: flex; justify-content: space-between; gap: 12px; }
.tip i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; }

/* 因素拆解 */
.factors { display: grid; gap: 10px; margin-top: 14px; }
.frow { display: grid; grid-template-columns: 128px minmax(0, 1fr) 96px; align-items: center; gap: 12px; }
.frow .fname { font-size: 14px; font-weight: 500; }
.frow .fname small { display: block; color: var(--muted); font-weight: 400; font-size: 12px; }
.fbar { position: relative; height: 22px; background: var(--sunken); border-radius: 4px; }
.fbar::after { content: ""; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--muted); }
.fbar span { position: absolute; top: 3px; bottom: 3px; }
.fbar span.pos { left: 50%; background: var(--up); border-radius: 0 4px 4px 0; }
.fbar span.neg { right: 50%; background: var(--down); border-radius: 4px 0 0 4px; }
.fval { text-align: right; font-size: 14px; font-weight: 600; }
.fval small { display: block; font-weight: 400; color: var(--muted); font-size: 11px; }
.faxis { display: grid; grid-template-columns: 128px minmax(0, 1fr) 96px; gap: 12px; font-size: 11px; color: var(--muted); }
.faxis div { display: flex; justify-content: space-between; }
@media (max-width: 520px) {
  .frow, .faxis { grid-template-columns: 88px minmax(0, 1fr) 64px; gap: 8px; }
}

.duo { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
@media (max-width: 760px) { .duo { grid-template-columns: 1fr; } }
.notes { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 8px; }
.notes li { display: grid; grid-template-columns: 16px minmax(0, 1fr); gap: 8px; font-size: 14px; }
.notes li::before { content: "•"; color: var(--muted); }

/* 新聞 */
.news-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
@media (max-width: 960px) { .news-grid { grid-template-columns: 1fr; } }
.tally { display: flex; gap: 6px; font-size: 12px; font-weight: 400; }
.tally span { padding: 1px 8px; border-radius: 999px; background: var(--sunken); color: var(--ink-2); }
.tally .t-up { background: var(--up-soft); color: var(--up); }
.tally .t-down { background: var(--down-soft); color: var(--down); }
.news { list-style: none; margin: 12px 0 0; padding: 0; display: grid; }
.news li { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 6px; padding-block: 9px; border-top: 1px solid var(--line); }
.news li:first-child { border-top: 0; }
.news .tag { font-size: 12px; font-weight: 700; line-height: 1.7; text-align: center; }
.news a { text-decoration: none; font-size: 14px; line-height: 1.5; }
.news a:hover { text-decoration: underline; }
.news .meta { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; }
.more { margin-top: 8px; font: 500 13px var(--font-body); background: none; border: 0; color: var(--accent); cursor: pointer; padding: 4px 0; }

.ai p { margin: 12px 0 0; white-space: pre-wrap; max-width: 72ch; }
footer { font-size: 12px; color: var(--muted); display: grid; gap: 4px; }
footer p { margin: 0; max-width: 90ch; }
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>柏君投資訊號</h1>
      <span>股價・新聞・總經・政治　多因子買賣評估</span>
    </div>
    <div class="search">
      <form id="search-form" autocomplete="off">
        <label class="label" for="symbol" hidden>股票代號</label>
        <input id="symbol" name="symbol" placeholder="代號，如 2330、AAPL" maxlength="16" required>
        <button class="btn" id="go" type="submit">分析</button>
      </form>
      <div class="chips" id="chips"></div>
    </div>
  </header>

  <div class="banner" id="banner" hidden></div>

  <main id="main" aria-live="polite">
    <div class="status" id="status" hidden></div>
    <div class="report" id="report"></div>
  </main>

  <footer>
    <p id="disclaimer">⚠️ 本分析由程式依公開網路資料自動產生，僅供參考，不構成投資建議，投資請自行判斷並承擔風險。</p>
    <p>資料來源：Yahoo Finance（股價、指數、VIX、美債殖利率、匯率）、Google News（近 7 天新聞）。新聞情緒以標題關鍵字判讀，可能誤判語意。</p>
  </footer>
</div>

<script>
(() => {
  const SNAP = window.__SNAPSHOT__ || null;
  const DEFAULT_CHIPS = [["2330", "台積電"], ["0050", "元大台灣50"], ["2454", "聯發科"], ["2317", "鴻海"], ["NVDA", "輝達"], ["AAPL", "蘋果"]];
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const fmt = (v, d = 2) => v == null ? "—" : Number(v).toLocaleString("zh-TW", { minimumFractionDigits: d, maximumFractionDigits: d });
  const signed = (v, d = 0) => (v > 0 ? "+" : v < 0 ? "−" : "±") + Math.abs(v).toFixed(d);
  const dir = (v) => v > 0 ? "up" : v < 0 ? "down" : "flat";
  let current = null;

  function chipList() {
    if (SNAP) return Object.values(SNAP.reports).map((r) => [r.symbol.replace(/\.TWO?$/, ""), r.zh || ""]);
    return DEFAULT_CHIPS;
  }
  function renderChips(active) {
    $("chips").innerHTML = chipList().map(([s, n]) =>
      `<button type="button" class="chip" data-s="${esc(s)}" aria-pressed="${s === active}">${esc(s)}${n ? `<small>${esc(n)}</small>` : ""}</button>`).join("");
  }

  function verdictClass(total) { return total >= 15 ? "buy" : total <= -15 ? "sell" : "hold"; }
  function verdictText(v) { return String(v).replace(/^[^\p{L}]+/u, "").trim(); }
  function ago(iso) {
    if (!iso) return "";
    const h = (Date.now() - new Date(iso).getTime()) / 36e5;
    if (h < 1) return "1 小時內";
    if (h < 24) return `${Math.floor(h)} 小時前`;
    return `${Math.floor(h / 24)} 天前`;
  }

  async function load(sym) {
    sym = sym.trim().toUpperCase();
    if (!sym) return;
    $("symbol").value = sym;
    renderChips(sym);
    if (SNAP) {
      const r = Object.values(SNAP.reports).find((x) => x.symbol.replace(/\.TWO?$/, "") === sym || x.symbol === sym);
      if (!r) return showStatus(`這份快照只收錄 ${chipList().map((c) => c[0]).join("、")}。要查其他股票，請把網站部署後即時查詢。`, true);
      showStatus(null);
      return render(r);
    }
    $("main").setAttribute("aria-busy", "true");
    $("go").disabled = true;
    showStatus("正在抓取股價、個股新聞、財經與政治新聞、總經指標…約需 5–10 秒", false, true);
    try {
      const res = await fetch(`/api/analyze?symbol=${encodeURIComponent(sym)}`);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || `伺服器錯誤（${res.status}）`);
      showStatus(null);
      render(data);
      try { localStorage.setItem("invest:last", sym); } catch (e) {}
      history.replaceState(null, "", `?s=${encodeURIComponent(sym)}`);
    } catch (e) {
      showStatus(e.message || "連線失敗，請稍後再試。", true);
    } finally {
      $("main").removeAttribute("aria-busy");
      $("go").disabled = false;
    }
  }

  function showStatus(msg, isError = false, spin = false) {
    const el = $("status");
    el.hidden = !msg;
    el.className = "status" + (isError ? " error" : "");
    el.innerHTML = msg ? (spin ? '<span class="spinner" aria-hidden="true"></span>' : "") + `<span>${esc(msg)}</span>` : "";
  }

  function render(r) {
    current = r;
    const f = Object.fromEntries(r.factors.map((x) => [x.key, x]));
    const chg = r.change_pct ?? 0;
    const pos52 = r.high_52w > r.low_52w ? Math.min(100, Math.max(0, (r.price - r.low_52w) / (r.high_52w - r.low_52w) * 100)) : 50;
    const needle = (Math.max(-100, Math.min(100, r.total)) + 100) / 2;
    const top = [...r.factors].sort((a, b) => Math.abs(b.score * b.weight) - Math.abs(a.score * a.weight))[0];
    const when = new Date(r.generated_at).toLocaleString("zh-TW", { dateStyle: "medium", timeStyle: "short" });

    $("report").innerHTML = `
      <section class="summary">
        <div class="panel quote">
          <div>
            <div class="name">${esc(r.zh || r.name)}</div>
            <div class="sym num">${esc(r.symbol)}${r.zh ? ` · ${esc(r.name)}` : ""}</div>
          </div>
          <div class="price-row">
            <span class="price num">${fmt(r.price)}</span>
            <span class="ccy">${esc(r.currency)}</span>
            <span class="chg num ${dir(chg)}">${chg > 0 ? "▲" : chg < 0 ? "▼" : ""} ${signed(chg, 2)}%</span>
          </div>
          <div class="range">
            <span class="label">52 週區間</span>
            <div class="range-track"><span class="range-dot" style="left:${pos52}%"></span></div>
            <div class="range-ends num"><span>${fmt(r.low_52w)}</span><span>${fmt(r.high_52w)}</span></div>
          </div>
          <span class="label">分析時間 ${esc(when)}</span>
        </div>
        <div class="panel signal">
          <span class="label">綜合評分（−100 至 +100）</span>
          <div class="signal-head">
            <span class="score num ${dir(r.total)}">${signed(r.total)}</span>
            <span class="verdict ${verdictClass(r.total)}">${esc(verdictText(r.verdict))}</span>
          </div>
          <div class="gauge" role="img" aria-label="綜合評分 ${signed(r.total)}，${esc(verdictText(r.verdict))}">
            <div class="gauge-bar"><i></i><i></i><i></i><i></i><i></i><span class="gauge-needle" style="left:${needle}%"></span></div>
            <div class="gauge-zones"><span>強力賣出</span><span>賣出</span><span>持有</span><span>買進</span><span>強力買進</span></div>
            <div class="gauge-ticks num">${[-100, -40, -15, 0, 15, 40, 100].map((t) => `<span style="left:${(t + 100) / 2}%">${t === 0 ? "0" : signed(t)}</span>`).join("")}</div>
          </div>
          <p>影響最大的是<b>${esc(top.label)}</b>（${signed(top.score)} 分 × 權重 ${Math.round(top.weight * 100)}%）。</p>
        </div>
      </section>

      <section class="panel">
        <h2>近 6 個月股價與均線 <small>滑過圖表看每日數值</small></h2>
        <div class="legend" style="margin-top:8px">
          <span><i style="background:var(--series-1)"></i>收盤價</span>
          <span><i style="background:var(--series-2)"></i>月線 MA20</span>
          <span><i style="background:var(--series-3)"></i>季線 MA60</span>
        </div>
        <div class="chart-box" id="chart"></div>
      </section>

      <section class="panel">
        <h2>各因素分數 <small>紅色偏多、綠色偏空；貢獻 = 分數 × 權重</small></h2>
        <div class="factors">
          ${r.factors.map((x) => `
            <div class="frow">
              <div class="fname">${esc(x.label)}<small>權重 ${Math.round(x.weight * 100)}%</small></div>
              <div class="fbar" title="${esc(x.label)} ${signed(x.score)}"><span class="${x.score >= 0 ? "pos" : "neg"}" style="width:${Math.abs(x.score) / 2}%"></span></div>
              <div class="fval num ${dir(x.score)}">${signed(x.score)}<small>貢獻 ${signed(x.score * x.weight, 1)}</small></div>
            </div>`).join("")}
          <div class="faxis num"><span></span><div><span>−100 偏空</span><span>0</span><span>偏多 +100</span></div><span></span></div>
        </div>
      </section>

      <section class="duo">
        <div class="panel"><h2>技術面 <small class="num">${signed(f.technical.score)}</small></h2>
          <ul class="notes">${f.technical.notes.map((n) => `<li>${esc(n)}</li>`).join("")}</ul></div>
        <div class="panel"><h2>大盤與總經 <small class="num">${signed(f.market.score)}</small></h2>
          <ul class="notes">${(f.market.notes || []).map((n) => `<li>${esc(n)}</li>`).join("") || "<li>暫無資料</li>"}</ul></div>
      </section>

      ${r.ai ? `<section class="panel ai"><h2>AI 綜合研判 <small>由 Claude 閱讀上述資料後撰寫</small></h2><p>${esc(r.ai)}</p></section>` : ""}

      <section class="news-grid">
        ${["stock_news", "finance_news", "politics_news"].map((k) => newsPanel(f[k])).join("")}
      </section>`;

    $("disclaimer").textContent = r.disclaimer || $("disclaimer").textContent;
    drawChart();
    document.querySelectorAll(".more").forEach((b) => b.addEventListener("click", () => {
      const list = b.previousElementSibling;
      const open = list.classList.toggle("all");
      list.querySelectorAll("li[data-extra]").forEach((li) => (li.hidden = !open));
      b.textContent = open ? "收合" : `顯示全部 ${list.children.length} 則`;
    }));
  }

  function newsPanel(x) {
    const LIMIT = 6;
    // 有情緒傾向的新聞排前面，其餘依時間
    const items = [...x.news].sort((a, b) => (Math.abs(b.score) > 0) - (Math.abs(a.score) > 0) || (b.published || "").localeCompare(a.published || ""));
    return `<div class="panel">
      <h2>${esc(x.label)}<span class="tally"><span class="t-up">利多 ${x.pos}</span><span class="t-down">利空 ${x.neg}</span><span>中性 ${x.neu}</span></span></h2>
      <ul class="news">${items.map((n, i) => `
        <li ${i >= LIMIT ? "data-extra hidden" : ""}>
          <span class="tag ${dir(n.score)}" aria-label="${n.score > 0 ? "利多" : n.score < 0 ? "利空" : "中性"}">${n.score > 0 ? "▲" : n.score < 0 ? "▼" : "·"}</span>
          <span><a href="${esc(n.link)}" target="_blank" rel="noopener">${esc(n.title)}</a><span class="meta">${esc(n.source)}${n.published ? ` · ${ago(n.published)}` : ""}</span></span>
        </li>`).join("") || "<li><span></span><span>近 7 天沒有相關新聞</span></li>"}</ul>
      ${items.length > LIMIT ? `<button type="button" class="more">顯示全部 ${items.length} 則</button>` : ""}
    </div>`;
  }

  function niceTicks(min, max, count) {
    const span = max - min || 1;
    const step0 = span / count;
    const mag = Math.pow(10, Math.floor(Math.log10(step0)));
    const step = [1, 2, 2.5, 5, 10].map((m) => m * mag).find((s) => s >= step0);
    const ticks = [];
    for (let v = Math.ceil(min / step) * step; v <= max + 1e-9; v += step) ticks.push(+v.toFixed(6));
    return ticks;
  }

  function drawChart() {
    const box = $("chart");
    if (!box || !current) return;
    const c = current.chart;
    const W = Math.max(300, box.clientWidth), H = W < 520 ? 220 : 280;
    const m = { t: 10, r: W < 520 ? 44 : 64, b: 26, l: 8 };
    const all = [...c.close, ...c.ma20, ...c.ma60].filter((v) => v != null);
    let lo = Math.min(...all), hi = Math.max(...all);
    const pad = (hi - lo) * 0.06; lo -= pad; hi += pad;
    const ticks = niceTicks(lo, hi, 4).filter((t) => t >= lo && t <= hi);
    const n = c.close.length;
    const x = (i) => m.l + (i / (n - 1)) * (W - m.l - m.r);
    const y = (v) => m.t + (1 - (v - lo) / (hi - lo)) * (H - m.t - m.b);
    const path = (arr) => arr.reduce((d, v, i) => v == null ? d : d + `${d && arr[i - 1] != null ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`, "");
    const months = [];
    c.dates.forEach((d, i) => { if (i > 0 && d.slice(5, 7) !== c.dates[i - 1].slice(5, 7)) months.push(i); });
    const last = n - 1;
    const area = `${path(c.close)}L${x(last)},${H - m.b}L${x(0)},${H - m.b}Z`;
    box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(current.symbol)} 近 ${n} 個交易日收盤價與均線">
      <defs><linearGradient id="g-area" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--series-1)" stop-opacity=".16"/><stop offset="1" stop-color="var(--series-1)" stop-opacity="0"/></linearGradient></defs>
      ${ticks.map((t) => `<line x1="${m.l}" x2="${W - m.r}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="1"/>
        <text x="${W - m.r + 6}" y="${y(t) + 4}" font-size="11" fill="var(--muted)" font-family="var(--font-data)">${fmt(t, t >= 1000 ? 0 : t >= 10 ? 0 : 2)}</text>`).join("")}
      ${months.map((i) => `<text x="${x(i)}" y="${H - 8}" font-size="11" fill="var(--muted)" text-anchor="middle" font-family="var(--font-data)">${+c.dates[i].slice(5, 7)}月</text>`).join("")}
      <path d="${area}" fill="url(#g-area)" stroke="none"/>
      <path d="${path(c.ma60)}" fill="none" stroke="var(--series-3)" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="${path(c.ma20)}" fill="none" stroke="var(--series-2)" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="${path(c.close)}" fill="none" stroke="var(--series-1)" stroke-width="2" stroke-linejoin="round"/>
      <circle cx="${x(last)}" cy="${y(c.close[last])}" r="4" fill="var(--series-1)" stroke="var(--surface)" stroke-width="2"/>
      <g id="hover" visibility="hidden"><line id="hx" y1="${m.t}" y2="${H - m.b}" stroke="var(--muted)" stroke-dasharray="3 3"/>
        <circle id="hc" r="4" fill="var(--series-1)" stroke="var(--surface)" stroke-width="2"/></g>
      <rect id="hit" x="${m.l}" y="0" width="${W - m.l - m.r}" height="${H}" fill="transparent"/>
    </svg><div class="tip" id="tip" hidden></div>`;

    const svg = box.querySelector("svg"), tip = $("tip");
    const move = (ev) => {
      const rect = svg.getBoundingClientRect();
      const px = (ev.clientX - rect.left) * (W / rect.width);
      const i = Math.max(0, Math.min(n - 1, Math.round(((px - m.l) / (W - m.l - m.r)) * (n - 1))));
      $("hover").setAttribute("visibility", "visible");
      $("hx").setAttribute("x1", x(i)); $("hx").setAttribute("x2", x(i));
      $("hc").setAttribute("cx", x(i)); $("hc").setAttribute("cy", y(c.close[i]));
      const prev = i > 0 ? (c.close[i] / c.close[i - 1] - 1) * 100 : null;
      tip.innerHTML = `<b class="num">${c.dates[i]}</b>
        <div><span><i style="background:var(--series-1)"></i>收盤</span><span class="num">${fmt(c.close[i])}${prev != null ? ` <span class="${dir(prev)}">${signed(prev, 2)}%</span>` : ""}</span></div>
        <div><span><i style="background:var(--series-2)"></i>MA20</span><span class="num">${fmt(c.ma20[i])}</span></div>
        <div><span><i style="background:var(--series-3)"></i>MA60</span><span class="num">${fmt(c.ma60[i])}</span></div>`;
      tip.hidden = false;
      const bx = box.getBoundingClientRect();
      const left = (x(i) / W) * bx.width;
      tip.style.left = `${Math.min(bx.width - tip.offsetWidth, Math.max(0, left > bx.width / 2 ? left - tip.offsetWidth - 12 : left + 12))}px`;
      tip.style.top = "8px";
    };
    const leave = () => { $("hover").setAttribute("visibility", "hidden"); tip.hidden = true; };
    svg.addEventListener("pointermove", move);
    svg.addEventListener("pointerdown", move);
    svg.addEventListener("pointerleave", leave);
  }

  let rt;
  window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(drawChart, 120); });
  $("search-form").addEventListener("submit", (e) => { e.preventDefault(); load($("symbol").value); });
  $("chips").addEventListener("click", (e) => { const b = e.target.closest(".chip"); if (b) load(b.dataset.s); });

  if (SNAP) {
    const b = $("banner");
    b.hidden = false;
    b.textContent = `這是 ${new Date(SNAP.generated_at).toLocaleString("zh-TW", { dateStyle: "long", timeStyle: "short" })} 的分析快照，收錄 ${chipList().length} 檔股票。把專案部署到 Render 後，網站首頁就能即時查詢任何台股或美股代號。`;
  }
  let first = new URLSearchParams(location.search).get("s");
  if (!first) { try { first = localStorage.getItem("invest:last"); } catch (e) {} }
  if (SNAP && !chipList().some((c) => c[0] === first)) first = null;
  renderChips();
  load(first || chipList()[0][0]);
})();
</script>

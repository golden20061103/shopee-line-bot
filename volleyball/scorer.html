<title>排球計分板</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: scoreboard strip on top, half-court with tappable player discs, then stats + rally log. Bottom sheet for 得分/失分. */
:root {
  --bg: #EDF1F6;
  --surface: #FFFFFF;
  --ink: #142033;
  --muted: #5A6780;
  --line: #D3DAE5;
  --court: #D9652B;
  --court-ink: #FFFFFF;
  --zone: #2C5E9E;
  --net: #1B2638;
  --win: #1D8656;
  --win-soft: #E2F3EA;
  --lose: #CC3535;
  --lose-soft: #FBE5E5;
  --shadow: 0 6px 18px rgba(20, 32, 51, .12);
  --f-display: "Saira Condensed", "Arial Narrow", "Noto Sans TC", sans-serif;
  --f-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C131F; --surface: #152033; --ink: #E7ECF4; --muted: #95A2B8; --line: #26344A;
    --court: #C2582A; --court-ink: #FFF6EF; --zone: #1D3D6B; --net: #04080F;
    --win: #3DBE85; --win-soft: #143528; --lose: #EF6767; --lose-soft: #3A1A1D;
    --shadow: 0 6px 18px rgba(0, 0, 0, .45); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C131F; --surface: #152033; --ink: #E7ECF4; --muted: #95A2B8; --line: #26344A;
  --court: #C2582A; --court-ink: #FFF6EF; --zone: #1D3D6B; --net: #04080F;
  --win: #3DBE85; --win-soft: #143528; --lose: #EF6767; --lose-soft: #3A1A1D;
  --shadow: 0 6px 18px rgba(0, 0, 0, .45); color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 980px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 48px; display: grid; gap: 18px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--court); outline-offset: 2px; }
h2 { font-family: var(--f-display); font-weight: 700; font-size: 1.35rem; letter-spacing: .04em; margin: 0; text-wrap: balance; }
.label { font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 500; }

/* Scoreboard */
.board { background: var(--net); color: #F4F6FA; border-radius: 14px; padding: 14px 16px; display: grid; gap: 10px; box-shadow: var(--shadow); }
.board-row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; }
.team { display: grid; gap: 2px; min-width: 0; }
.team.them { text-align: right; }
.team input { background: transparent; border: 0; border-bottom: 1px dashed rgba(255,255,255,.25); color: inherit; font: 700 1.05rem var(--f-body); width: 100%; padding: 2px 0; }
.team.them input { text-align: right; }
.sets-won { font-family: var(--f-display); font-size: .95rem; color: #AFC0DA; letter-spacing: .06em; }
.serve-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #F2C230; margin-inline: 6px; vertical-align: middle; visibility: hidden; }
.serve-dot.on { visibility: visible; }
.score { display: flex; align-items: center; gap: 10px; font-family: var(--f-display); font-weight: 800; font-variant-numeric: tabular-nums; }
.score .num { font-size: clamp(3rem, 12vw, 5rem); line-height: 1; min-width: 1.3em; text-align: center; }
.score .num.us { color: #FFB27D; }
.score .sep { font-size: 2rem; color: #6F80A0; }
.set-meta { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 6px 8px; font-size: .82rem; color: #AFC0DA; }
.chip { font-family: var(--f-display); font-variant-numeric: tabular-nums; border: 1px solid rgba(255,255,255,.18); padding: 1px 8px; border-radius: 999px; }
.chip.w { border-color: #FFB27D; color: #FFB27D; }
.banner { text-align: center; font-weight: 700; color: #F2C230; }

/* Toolbar */
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 14px; font-weight: 500; }
.btn:hover { border-color: var(--muted); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.danger { color: var(--lose); }
.btn.armed { background: var(--lose); color: #fff; border-color: var(--lose); }
.toolbar select { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 10px; padding: 8px 10px; font: inherit; }
.toolbar .spacer { flex: 1; }

/* Court */
.court-wrap { background: var(--zone); border-radius: 14px; padding: 0 18px 22px; box-shadow: var(--shadow); }
.net { height: 14px; margin-inline: -18px; background: repeating-linear-gradient(90deg, var(--net) 0 6px, #3A4A66 6px 8px); border-radius: 14px 14px 0 0; position: relative; }
.net::after { content: "球網 NET"; position: absolute; right: 12px; top: -1px; font: 700 .62rem var(--f-display); letter-spacing: .2em; color: #C9D3E4; }
.court { background: var(--court); border: 3px solid var(--court-ink); border-top: 0; position: relative; padding: 18px 8px 22px; display: grid; gap: 8px; }
.attack-line { position: absolute; left: 0; right: 0; top: 46%; border-top: 3px solid var(--court-ink); opacity: .9; }
.attack-line span { position: absolute; left: 8px; top: 2px; font: 600 .66rem var(--f-display); letter-spacing: .14em; color: var(--court-ink); opacity: .85; }
.row { display: flex; justify-content: space-around; gap: 6px; position: relative; z-index: 1; }
.row.back { padding-top: 34px; }
.player { display: grid; justify-items: center; gap: 4px; background: none; border: 0; padding: 4px; border-radius: 16px; min-width: 0; }
.disc { width: clamp(64px, 18vw, 92px); aspect-ratio: 1; max-width: 100%; border-radius: 50%; background: var(--surface); color: var(--ink); border: 4px solid var(--court-ink); display: grid; place-content: center; text-align: center; box-shadow: 0 4px 0 rgba(0,0,0,.18); transition: transform .12s ease, box-shadow .12s ease; position: relative; }
.player:hover .disc { transform: translateY(-2px); box-shadow: 0 7px 0 rgba(0,0,0,.18); }
.player:active .disc { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,.18); }
.disc .no { font: 800 clamp(1.5rem, 6vw, 2.1rem)/1 var(--f-display); font-variant-numeric: tabular-nums; }
.disc .role { font-size: .74rem; font-weight: 700; color: var(--court); }
.disc.s { border-color: #F2C230; }
.disc.l { background: var(--net); color: #F4F6FA; border-color: #8FD3FF; }
.disc.l .role { color: #8FD3FF; }
.p-name { color: var(--court-ink); font-weight: 700; font-size: clamp(.74rem, 3vw, .85rem); max-width: 8em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.25); }
.tally { display: flex; gap: 4px; font: 700 .78rem var(--f-display); font-variant-numeric: tabular-nums; }
.tally b { padding: 0 6px; border-radius: 6px; font-weight: 700; }
.tally .w { background: var(--win-soft); color: var(--win); }
.tally .l { background: var(--lose-soft); color: var(--lose); }
.team-row { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 12px 20px; margin-top: 18px; }
.team-row .p-name { color: #fff; }
.team-btn { display: flex; align-items: center; gap: 12px; border: 2px dashed rgba(255,255,255,.55); background: rgba(0,0,0,.12); color: #fff; border-radius: 999px; padding: 6px 18px 6px 6px; }
.team-btn .mini { width: 44px; height: 44px; border-radius: 50%; background: var(--net); display: grid; place-content: center; font: 800 .9rem var(--f-display); }
.team-btn .txt { text-align: left; line-height: 1.25; }
.team-btn .txt small { display: block; opacity: .8; font-size: .75rem; }
.hint { color: #DCE5F3; font-size: .8rem; text-align: center; margin: 12px 0 0; }

/* Panels */
.panels { display: grid; grid-template-columns: 1.25fr 1fr; gap: 18px; }
@media (max-width: 760px) { .panels { grid-template-columns: 1fr; } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; min-width: 0; display: grid; gap: 10px; align-content: start; }
.panel-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 3px 10px; font-size: .8rem; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.table-scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; font-size: .88rem; }
th, td { padding: 7px 6px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
th { font-weight: 500; color: var(--muted); font-size: .76rem; letter-spacing: .04em; }
td.pos { color: var(--win); font-weight: 700; }
td.neg { color: var(--lose); font-weight: 700; }
tfoot td { font-weight: 700; border-bottom: 0; }
.breakdown { display: grid; gap: 8px; }
.bd-row { display: grid; grid-template-columns: 5.5em 1fr; gap: 8px; align-items: start; font-size: .82rem; }
.bd-row .who { font-weight: 700; }
.bd-tags { display: flex; flex-wrap: wrap; gap: 4px; }
.tag { padding: 1px 8px; border-radius: 999px; font-size: .76rem; }
.tag.w { background: var(--win-soft); color: var(--win); }
.tag.l { background: var(--lose-soft); color: var(--lose); }
.log { list-style: none; margin: 0; padding: 0; max-height: 420px; overflow-y: auto; display: grid; }
.log li { display: grid; grid-template-columns: 3.4em 1fr auto; gap: 8px; padding: 6px 2px; border-bottom: 1px solid var(--line); font-size: .85rem; align-items: center; }
.log .sc { font: 700 .95rem var(--f-display); font-variant-numeric: tabular-nums; }
.log .mark { width: 22px; height: 22px; border-radius: 50%; display: grid; place-content: center; font-weight: 700; font-size: .8rem; }
.log .mark.w { background: var(--win-soft); color: var(--win); }
.log .mark.l { background: var(--lose-soft); color: var(--lose); }
.log .setsep { display: block; grid-template-columns: none; color: var(--muted); font-size: .75rem; letter-spacing: .1em; text-align: center; background: var(--bg); border-radius: 6px; margin-top: 4px; }
.empty { color: var(--muted); font-size: .88rem; padding: 10px 0; }

/* Sheet */
.scrim { position: fixed; inset: 0; background: rgba(6, 10, 18, .55); z-index: 20; }
.sheet { position: fixed; left: 50%; bottom: 0; transform: translateX(-50%); width: min(720px, 100%); max-height: 88%; overflow-y: auto; background: var(--surface); border-radius: 18px 18px 0 0; z-index: 21; padding: 16px 16px calc(20px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px; box-shadow: 0 -10px 30px rgba(0,0,0,.25); animation: up .18s ease-out; }
@keyframes up { from { transform: translate(-50%, 30px); opacity: .4; } to { transform: translate(-50%, 0); opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .sheet { animation: none; } .disc { transition: none; } }
.sheet-head { display: flex; align-items: center; gap: 12px; }
.sheet-head .disc { width: 58px; border-width: 3px; box-shadow: none; border-color: var(--court); }
.sheet-head .disc .no { font-size: 1.4rem; }
.sheet-head .t { flex: 1; min-width: 0; }
.sheet-head .t strong { font-size: 1.1rem; display: block; }
.sheet-head .t span { color: var(--muted); font-size: .82rem; }
.x { border: 1px solid var(--line); background: transparent; border-radius: 50%; width: 36px; height: 36px; font-size: 1.1rem; }
.edit { display: grid; grid-template-columns: 5em 1fr; gap: 8px; }
.edit label { display: grid; gap: 2px; font-size: .75rem; color: var(--muted); }
.edit input { border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); padding: 7px 10px; font: inherit; width: 100%; }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 520px) { .cols { grid-template-columns: 1fr; } }
.col { display: grid; gap: 8px; align-content: start; }
.col h3 { margin: 0; font: 700 1.1rem var(--f-display); letter-spacing: .08em; display: flex; align-items: center; gap: 8px; }
.col.w h3 { color: var(--win); }
.col.l h3 { color: var(--lose); }
.col h3 small { font: 500 .75rem var(--f-body); color: var(--muted); letter-spacing: 0; }
.grp { font-size: .72rem; color: var(--muted); letter-spacing: .1em; margin-top: 4px; }
.acts { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.act { border-radius: 10px; padding: 10px 8px; font-weight: 700; font-size: .9rem; text-align: left; display: grid; gap: 0; line-height: 1.25; }
.act small { font-weight: 400; font-size: .72rem; opacity: .8; }
.col.w .act { background: var(--win-soft); color: var(--win); border: 1px solid transparent; }
.col.l .act { background: var(--lose-soft); color: var(--lose); border: 1px solid transparent; }
.col.w .act:hover { border-color: var(--win); }
.col.l .act:hover { border-color: var(--lose); }
.locked { text-align: center; color: var(--muted); padding: 8px; }

/* Toast */
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--net); color: #F4F6FA; padding: 10px 10px 10px 16px; border-radius: 12px; display: flex; gap: 12px; align-items: center; z-index: 30; box-shadow: var(--shadow); max-width: calc(100% - 32px); font-size: .9rem; }
@media (max-width: 520px) { .toast { left: 16px; right: 16px; transform: none; max-width: none; } }
.toast span { min-width: 0; flex: 1; }
.toast button { white-space: nowrap; flex: none; background: transparent; border: 1px solid rgba(255,255,255,.3); color: #FFB27D; border-radius: 8px; padding: 4px 10px; font-weight: 700; }

/* Tabs */
.tabs { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 4px; width: fit-content; max-width: 100%; }
.tabs button { border: 0; background: transparent; border-radius: 9px; padding: 8px 18px; font-weight: 700; color: var(--muted); }
.tabs button[aria-selected="true"] { background: var(--net); color: #F4F6FA; }
.view { display: grid; gap: 18px; }

/* Simulator */
:root { --amber: #C98512; --them-disc: #1B2638; --them-ring: #8FB8F0; --pick: #F2C230; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --amber: #F0B04A; --them-disc: #04080F; --them-ring: #8FB8F0; } }
:root[data-theme="dark"] { --amber: #F0B04A; --them-disc: #04080F; --them-ring: #8FB8F0; }
.sim { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 820px) { .sim { grid-template-columns: 1fr; } }
.sim-court { background: var(--zone); border-radius: 14px; padding: 8px; box-shadow: var(--shadow); max-width: 520px; width: 100%; justify-self: center; }
.sim-court svg { display: block; width: 100%; height: auto; touch-action: none; user-select: none; -webkit-user-select: none; }
.sv-free { fill: var(--zone); }
.sv-court { fill: var(--court); }
.sv-grid { stroke: var(--court-ink); stroke-width: .015; opacity: .35; }
.sv-zone { fill: none; stroke: var(--court-ink); stroke-width: .03; opacity: .55; stroke-dasharray: .12 .1; }
.sv-line { stroke: var(--court-ink); stroke-width: .05; fill: none; }
.sv-zno { fill: var(--court-ink); opacity: .28; font: 800 1.3px var(--f-display); text-anchor: middle; dominant-baseline: central; }
.sv-dim { fill: #DCE5F3; font: 600 .34px var(--f-display); text-anchor: middle; dominant-baseline: central; letter-spacing: .02px; }
.sv-net { stroke: var(--net); stroke-width: .16; }
.sv-ant { stroke: #F4F6FA; stroke-width: .08; stroke-dasharray: .12 .12; }
.sv-side { fill: #DCE5F3; font: 700 .36px var(--f-body); text-anchor: middle; dominant-baseline: central; }
.sv-heat { fill: var(--lose); }
.sv-shadow { fill: var(--net); opacity: .28; }
.sv-route { stroke-width: .09; fill: none; stroke-linecap: round; }
.sv-route.blocked { stroke: #B9C6DA; stroke-dasharray: .2 .14; }
.sv-route.dig { stroke: var(--win); }
.sv-route.hard { stroke: var(--amber); }
.sv-route.gap, .sv-route.tool { stroke: var(--lose); }
.sv-route.tool { stroke-dasharray: .2 .14; }
.sv-end { stroke: var(--court-ink); stroke-width: .04; }
.sv-end.blocked { fill: #B9C6DA; } .sv-end.dig { fill: var(--win); } .sv-end.hard { fill: var(--amber); } .sv-end.gap, .sv-end.tool { fill: var(--lose); }
.sv-rlabel { font: 700 .3px var(--f-body); fill: var(--court-ink); paint-order: stroke; stroke: var(--net); stroke-width: .07; text-anchor: middle; }
.sv-gapmark { fill: none; stroke: var(--pick); stroke-width: .06; stroke-dasharray: .14 .1; }
.sv-gaptxt { fill: var(--pick); font: 700 .3px var(--f-body); text-anchor: middle; paint-order: stroke; stroke: var(--net); stroke-width: .07; }
.sv-p { cursor: grab; }
.sv-p:active { cursor: grabbing; }
.sv-p:focus { outline: none; }
.sv-p:focus-visible .sv-disc { stroke: var(--pick); stroke-width: .1; }
.sv-p.us .sv-disc { fill: var(--surface); stroke: var(--court-ink); stroke-width: .06; }
.sv-p.them .sv-disc { fill: var(--them-disc); stroke: var(--them-ring); stroke-width: .06; }
.sv-p.pick .sv-disc { stroke: var(--pick); stroke-width: .11; }
.sv-p .sv-no { font: 800 .4px var(--f-display); text-anchor: middle; dominant-baseline: central; }
.sv-p.us .sv-no { fill: var(--ink); } .sv-p.them .sv-no { fill: #F4F6FA; }
.sv-p .sv-role { font: 700 .24px var(--f-body); text-anchor: middle; fill: var(--court-ink); paint-order: stroke; stroke: rgba(0,0,0,.35); stroke-width: .05; }
.sv-p .sv-hit { fill: transparent; }
.sv-ball { fill: #FFF6D6; stroke: #1B2638; stroke-width: .04; }
.sim-side { display: grid; gap: 14px; min-width: 0; }
.sim-side .panel { gap: 12px; }
.sim-side .seg { justify-self: start; }
.ctl-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.ctl-row .btn { padding: 7px 12px; font-size: .88rem; }
.check { display: inline-flex; align-items: center; gap: 6px; font-size: .88rem; color: var(--muted); }
.check input { accent-color: var(--court); width: 16px; height: 16px; }
.kpi { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.kpi .big { font: 800 2.6rem/1 var(--f-display); font-variant-numeric: tabular-nums; }
.kpi .big.hi { color: var(--lose); } .kpi .big.mid { color: var(--amber); } .kpi .big.lo { color: var(--win); }
.kpi .txt { color: var(--muted); font-size: .85rem; min-width: 0; flex: 1; }
.advice { font-size: .88rem; display: grid; gap: 4px; margin: 0; padding-left: 1.2em; }
.oc { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: .76rem; font-weight: 700; }
.oc.blocked { background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
.oc.dig { background: var(--win-soft); color: var(--win); }
.oc.hard { background: var(--bg); color: var(--amber); border: 1px solid var(--amber); }
.oc.gap, .oc.tool { background: var(--lose-soft); color: var(--lose); }
.sim-result { font-size: .9rem; min-height: 1.5em; }
.sim-result strong { font-weight: 700; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: .78rem; color: var(--muted); }
.legend i { display: inline-block; width: 18px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 4px; }
</style>

<div class="wrap">
  <nav class="tabs" role="tablist" aria-label="功能">
    <button type="button" role="tab" data-view="score" aria-selected="true">計分</button>
    <button type="button" role="tab" data-view="sim" aria-selected="false">模擬對戰</button>
  </nav>
  <div class="view" id="view-score">
  <section class="board" aria-label="比分">
    <div class="board-row">
      <div class="team us">
        <input id="name-us" aria-label="我方隊名" maxlength="16">
        <div class="sets-won">局數 <span id="won-us">0</span><span class="serve-dot" id="srv-us" title="發球權"></span></div>
      </div>
      <div class="score" aria-live="polite">
        <span class="num us" id="sc-us">0</span><span class="sep">:</span><span class="num" id="sc-them">0</span>
      </div>
      <div class="team them">
        <input id="name-them" aria-label="對方隊名" maxlength="16">
        <div class="sets-won"><span class="serve-dot" id="srv-them" title="發球權"></span>局數 <span id="won-them">0</span></div>
      </div>
    </div>
    <div class="set-meta" id="set-meta"></div>
    <div class="banner" id="banner" hidden></div>
  </section>

  <div class="toolbar">
    <button class="btn" id="undo" type="button">↶ 復原上一球</button>
    <button class="btn" id="swap-serve" type="button" title="設定開局發球方">切換開局發球</button>
    <select id="best-of" aria-label="賽制">
      <option value="5">五局三勝（決勝局 15 分）</option>
      <option value="3">三局兩勝（決勝局 15 分）</option>
      <option value="1">單局 25 分</option>
    </select>
    <span class="spacer"></span>
    <button class="btn danger" id="reset" type="button">新比賽</button>
  </div>

  <section class="court-wrap" aria-label="球場陣容">
    <div class="net"></div>
    <div class="court">
      <div class="attack-line"><span>3M 攻擊線</span></div>
      <div class="row front" id="row-front"></div>
      <div class="row back" id="row-back"></div>
    </div>
    <div class="team-row" id="team-row"></div>
    <p class="hint">點選球員圈圈 → 選擇得分或失分項目。自由球員在場外，只能記防守、接發相關的得失分。對方失誤或無法歸屬的失分請點「團隊 / 對方」。</p>
  </section>

  <div class="panels">
    <section class="panel">
      <div class="panel-head">
        <h2>個人數據</h2>
        <div class="seg" id="scope" role="group" aria-label="統計範圍">
          <button type="button" data-scope="all" aria-pressed="true">全場</button>
          <button type="button" data-scope="set" aria-pressed="false">本局</button>
        </div>
      </div>
      <div class="table-scroll"><table id="stats"></table></div>
      <div class="label">得失分明細</div>
      <div class="breakdown" id="breakdown"></div>
    </section>
    <section class="panel">
      <div class="panel-head">
        <h2>逐球紀錄</h2>
        <span class="label" id="log-count"></span>
      </div>
      <ul class="log" id="log"></ul>
    </section>
  </div>
  </div>
  <div class="view" id="view-sim" hidden>
    <div class="sim">
      <div class="sim-court">
        <svg id="sim-svg" viewBox="-2.2 -1.6 13.4 21.2" role="img" aria-label="模擬球場：上半場對方、下半場我方，可拖曳球員"></svg>
      </div>
      <div class="sim-side">
        <section class="panel">
          <div class="panel-head"><h2>進攻設定</h2><span class="label">拖曳球員調整站位</span></div>
          <div class="seg" role="group" aria-label="進攻方">
            <button type="button" data-attack="them" aria-pressed="true">對方進攻</button>
            <button type="button" data-attack="us" aria-pressed="false">我方進攻</button>
          </div>
          <p class="empty" style="padding:0" id="sim-hint"></p>
          <div class="ctl-row">
            <button class="btn" type="button" id="sim-auto">自動排防守站位</button>
            <button class="btn" type="button" id="sim-base">回到基本站位</button>
          </div>
          <div class="ctl-row">
            <button class="btn" type="button" id="sim-rot-us">我方輪轉 ↻</button>
            <button class="btn" type="button" id="sim-rot-them">對方輪轉 ↻</button>
            <span class="label" id="sim-rot"></span>
          </div>
          <div class="ctl-row">
            <label class="check"><input type="checkbox" id="sim-heat" checked>防守空檔熱區</label>
            <label class="check"><input type="checkbox" id="sim-shadow" checked>攔網陰影</label>
          </div>
          <div class="legend">
            <span><i style="background:var(--lose)"></i>空檔 / 打手</span>
            <span><i style="background:var(--amber)"></i>勉強救</span>
            <span><i style="background:var(--win)"></i>可防起</span>
            <span><i style="background:#B9C6DA"></i>被攔網</span>
          </div>
        </section>
        <section class="panel">
          <div class="panel-head"><h2>球路分析</h2><span class="label" id="sim-attacker"></span></div>
          <div class="kpi"><span class="big" id="sim-rate">–</span><span class="txt" id="sim-rate-txt"></span></div>
          <div class="table-scroll"><table id="sim-routes"></table></div>
          <ul class="advice" id="sim-advice"></ul>
        </section>
        <section class="panel">
          <div class="panel-head"><h2>模擬來球</h2><span class="label" id="sim-count"></span></div>
          <div class="ctl-row">
            <button class="btn" type="button" id="sim-one">模擬一球</button>
            <button class="btn" type="button" id="sim-100">連續模擬 100 球</button>
            <button class="btn" type="button" id="sim-clear">清除統計</button>
          </div>
          <div class="sim-result" id="sim-result" aria-live="polite">按「模擬一球」，球會依球路機率飛出，並判定得失分。</div>
          <div class="breakdown" id="sim-tally"></div>
        </section>
      </div>
    </div>
  </div>
</div>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(function () {
  const KEY = 'vb-scorer-v1';

  // 正規陣容：兩個大砲（主攻）、兩個攔中、一個舉球、一個背攻（舉對），外加自由球員
  // pos 為場上位置號碼：前排左→右 4、3、2，後排左→右 5、6、1
  const DEFAULT_PLAYERS = [
    { id: 'oh1', role: '大砲', full: '大砲（主攻）一', pos: 4, row: 'front', no: '7',  name: '' },
    { id: 'mb',  role: '攔中', full: '攔中（快攻）一', pos: 3, row: 'front', no: '12', name: '' },
    { id: 'opp', role: '背攻', full: '背攻（舉對）',   pos: 2, row: 'front', no: '9',  name: '' },
    { id: 'oh2', role: '大砲', full: '大砲（主攻）二', pos: 5, row: 'back',  no: '4',  name: '' },
    { id: 'mb2', role: '攔中', full: '攔中（快攻）二', pos: 6, row: 'back',  no: '15', name: '' },
    { id: 's',   role: '舉球', full: '舉球（二傳）',   pos: 1, row: 'back',  no: '3',  name: '' },
    { id: 'l',   role: '自由', full: '自由球員',       pos: 0, row: 'libero', no: '1', name: '' }
  ];
  const ROW_ORDER = { front: [4, 3, 2], back: [5, 6, 1] };

  // 球員得分 / 失分項目（分組）
  const PLAYER_ACTS = {
    win: [
      { g: '攻擊', items: [
        ['atk', '攻擊得分', '強攻扣球落地'], ['quick', '快攻得分', '短平快 / 背飛'],
        ['back', '後排攻擊得分', '3M 線後起跳'], ['tool', '打手出界', '打攔網手出界'],
        ['tip', '吊球得分', '輕吊 / 搓球'], ['dump', '二次球得分', '舉球直接處理過網']
      ]},
      { g: '攔網 / 發球', items: [
        ['blk', '攔網得分', '直接攔死'], ['ace', '發球得分', 'Ace 直接得分'],
        ['srvpress', '發球破壞得分', '對方接發直接回球得分']
      ]},
      { g: '其他', items: [
        ['free', '推球 / 處理球得分', '機會球、搶攻'], ['cover', '防守反擊得分', '救起後直接得分']
      ]}
    ],
    lose: [
      { g: '攻擊失誤', items: [
        ['atkout', '攻擊出界', ''], ['atknet', '攻擊掛網', ''],
        ['blocked', '攻擊被攔死', ''], ['tipout', '吊球失誤', '']
      ]},
      { g: '發球 / 接發 / 防守', items: [
        ['srv', '發球失誤', '出界 / 掛網'], ['rcv', '接發失誤', '一傳被 Ace'],
        ['dig', '防守失誤', '漏球 / 救不起'], ['cover2', '保護不及', '攔網後沒補到']
      ]},
      { g: '舉球 / 攔網', items: [
        ['set', '舉球失誤', '舉不到位、無法進攻'], ['blkerr', '攔網失誤', '攔網出界、手部觸網']
      ]},
      { g: '犯規', items: [
        ['net', '觸網', ''], ['line', '踩線 / 越過中線', ''],
        ['dbl', '連擊', ''], ['hold', '持球', ''],
        ['four', '四次擊球', ''], ['backatk', '後排違規進攻', ''],
        ['rot', '輪轉 / 位置錯誤', ''], ['delay', '延誤比賽', '']
      ]}
    ]
  };

  // 團隊 / 對方：沒有個人責任的得失分
  const TEAM = { id: 'team', role: '團隊', full: '團隊 / 對方' };
  const TEAM_ACTS = {
    win: [
      { g: '對方失誤送分', items: [
        ['o_srv', '對方發球失誤', ''], ['o_atk', '對方攻擊失誤', '出界 / 掛網'],
        ['o_net', '對方觸網', ''], ['o_foul', '對方犯規', '連擊、持球、踩線'],
        ['o_rot', '對方輪轉錯誤', ''], ['o_card', '對方紅牌', '']
      ]}
    ],
    lose: [
      { g: '對方得分', items: [
        ['t_atk', '對方攻擊得分', ''], ['t_blk', '對方攔網得分', ''],
        ['t_ace', '對方發球得分', ''], ['t_tip', '對方吊球得分', ''],
        ['t_other', '我方失分（未指定）', ''], ['t_card', '我方紅牌', '']
      ]}
    ]
  };

  // 自由球員不能發球、攔網、在網上沿高度完成攻擊，所以只記協助得分與防守、接發相關失分
  const LIBERO_ACTS = {
    win: [
      { g: '協助得分', items: [
        ['l_dig', '防守起球得分', '救起後隊友得分'], ['l_rcv', '一傳到位得分', '接發到位後得分'],
        ['l_cover', '保護起球得分', '攔網保護後得分']
      ]}
    ],
    lose: [
      { g: '接發 / 防守', items: [
        ['rcv', '接發失誤', '一傳被 Ace'], ['dig', '防守失誤', '漏球 / 救不起'],
        ['cover2', '保護不及', '攔網後沒補到'], ['set', '舉球失誤', '二傳時舉不到位']
      ]},
      { g: '犯規', items: [
        ['l_front', '前區上手舉球違規', '隊友在網上攻擊'], ['l_atk', '自由球員違規進攻', ''],
        ['net', '觸網', ''], ['line', '踩線 / 越過中線', ''],
        ['dbl', '連擊', ''], ['hold', '持球', ''],
        ['l_sub', '替換違規', '']
      ]}
    ]
  };

  const LABELS = {};
  [PLAYER_ACTS, TEAM_ACTS, LIBERO_ACTS].forEach(set => ['win', 'lose'].forEach(t => set[t].forEach(gr => gr.items.forEach(([k, l]) => { LABELS[k] = l; }))));

  const ATTACK = ['atk', 'quick', 'back', 'tool', 'tip', 'dump', 'free', 'cover'];

  const fresh = () => ({
    teams: { us: '我方', them: '對方' },
    players: DEFAULT_PLAYERS.map(p => ({ ...p })),
    bestOf: 5,
    firstServe: 'us',
    events: []
  });

  let state = load();
  let scope = 'all';
  let openId = null;
  let toastTimer = null;

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) {
        const s = JSON.parse(raw);
        const base = fresh();
        return { ...base, ...s, players: base.players.map(p => { const o = (s.players || []).find(x => x.id === p.id); return o ? { ...p, no: o.no, name: o.name } : p; }) };
      }
    } catch (e) {}
    return fresh();
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  // 所有比分皆由事件推導，方便復原
  function compute() {
    const fmt = Number(state.bestOf);
    const need = Math.ceil(fmt / 2);
    const sets = [{ us: 0, them: 0, winner: null }];
    const won = { us: 0, them: 0 };
    let server = state.firstServe;
    let matchOver = null;
    const rows = [];
    for (const e of state.events) {
      const cur = sets[sets.length - 1];
      const side = e.type === 'win' ? 'us' : 'them';
      cur[side]++;
      server = side;
      rows.push({ e, set: sets.length, us: cur.us, them: cur.them });
      const target = (fmt > 1 && sets.length === fmt) ? 15 : 25;
      if ((cur.us >= target || cur.them >= target) && Math.abs(cur.us - cur.them) >= 2) {
        cur.winner = cur.us > cur.them ? 'us' : 'them';
        won[cur.winner]++;
        if (won[cur.winner] >= need) matchOver = cur.winner;
        else sets.push({ us: 0, them: 0, winner: null });
      }
    }
    return { sets, won, server, matchOver, rows, fmt };
  }

  function playerById(id) { return id === 'team' ? TEAM : state.players.find(p => p.id === id); }
  function whoLabel(p) {
    if (p.id === 'team') return '團隊 / 對方';
    return p.role + ' #' + p.no + (p.name ? ' ' + p.name : '');
  }

  function render() {
    const c = compute();
    const cur = c.sets[c.sets.length - 1];
    $('name-us').value = state.teams.us;
    $('name-them').value = state.teams.them;
    $('sc-us').textContent = cur.us;
    $('sc-them').textContent = cur.them;
    $('won-us').textContent = c.won.us;
    $('won-them').textContent = c.won.them;
    $('srv-us').classList.toggle('on', c.server === 'us' && !c.matchOver);
    $('srv-them').classList.toggle('on', c.server === 'them' && !c.matchOver);
    $('best-of').value = String(state.bestOf);
    $('best-of').disabled = state.events.length > 0;
    $('swap-serve').disabled = state.events.length > 0;
    $('undo').disabled = state.events.length === 0;

    const setNo = c.sets.length;
    const decider = c.fmt > 1 && setNo === c.fmt;
    let meta = '<span>第 ' + setNo + ' 局' + (decider ? '・決勝局 15 分' : '') + '</span>';
    c.sets.filter(s => s.winner).forEach((s, i) => {
      meta += '<span class="chip' + (s.winner === 'us' ? ' w' : '') + '">S' + (i + 1) + ' ' + s.us + ':' + s.them + '</span>';
    });
    $('set-meta').innerHTML = meta;

    const banner = $('banner');
    if (c.matchOver) {
      banner.hidden = false;
      banner.textContent = '比賽結束：' + (c.matchOver === 'us' ? state.teams.us : state.teams.them) + ' 以 ' + Math.max(c.won.us, c.won.them) + ':' + Math.min(c.won.us, c.won.them) + ' 獲勝';
    } else if (cur.us >= 24 - (decider ? 10 : 0) || cur.them >= 24 - (decider ? 10 : 0)) {
      const tgt = decider ? 15 : 25;
      const lead = cur.us - cur.them;
      banner.hidden = !(Math.abs(lead) >= 1 && Math.max(cur.us, cur.them) >= tgt - 1);
      banner.textContent = lead > 0 ? state.teams.us + ' 局點' : state.teams.them + ' 局點';
    } else banner.hidden = true;

    renderCourt();
    renderStats(c);
    renderLog(c);
    if (openId) renderSheet();
  }

  function tallyFor(id) {
    let w = 0, l = 0;
    state.events.forEach(e => { if (e.pid === id) e.type === 'win' ? w++ : l++; });
    return { w, l };
  }

  function discHTML(p) {
    const t = tallyFor(p.id);
    return '<button class="player" type="button" data-pid="' + p.id + '" aria-label="' + esc(p.full + ' #' + p.no + ' 記錄得失分') + '">' +
      '<span class="disc' + (p.id === 's' ? ' s' : p.id === 'l' ? ' l' : '') + '"><span class="no">' + esc(p.no || '–') + '</span><span class="role">' + esc(p.role) + '</span></span>' +
      '<span class="p-name">' + esc(p.name || p.full) + '</span>' +
      '<span class="tally"><b class="w">+' + t.w + '</b><b class="l">−' + t.l + '</b></span></button>';
  }

  function renderCourt() {
    const byRow = row => ROW_ORDER[row].map(pos => state.players.find(p => p.row === row && p.pos === pos)).filter(Boolean);
    $('row-front').innerHTML = byRow('front').map(discHTML).join('');
    $('row-back').innerHTML = byRow('back').map(discHTML).join('');
    const t = tallyFor('team');
    const libero = state.players.find(p => p.row === 'libero');
    $('team-row').innerHTML = (libero ? discHTML(libero) : '') + '<button class="team-btn" type="button" data-pid="team"><span class="mini">隊</span><span class="txt">團隊 / 對方<small>對方失誤 +' + t.w + '・對方得分 −' + t.l + '</small></span></button>';
  }

  function scopedEvents(c) {
    if (scope === 'all') return state.events;
    const setNo = c.sets.length;
    return c.rows.filter(r => r.set === setNo).map(r => r.e);
  }

  function renderStats(c) {
    const evs = scopedEvents(c);
    const list = [...state.players, TEAM];
    const tot = { atk: 0, blk: 0, ace: 0, w: 0, l: 0 };
    let body = '';
    list.forEach(p => {
      const mine = evs.filter(e => e.pid === p.id);
      const w = mine.filter(e => e.type === 'win');
      const l = mine.filter(e => e.type === 'lose');
      const atk = w.filter(e => ATTACK.includes(e.k)).length;
      const blk = w.filter(e => e.k === 'blk').length;
      const ace = w.filter(e => e.k === 'ace').length;
      const net = w.length - l.length;
      tot.atk += atk; tot.blk += blk; tot.ace += ace; tot.w += w.length; tot.l += l.length;
      const isTeam = p.id === 'team';
      body += '<tr><td>' + esc(isTeam ? '團隊 / 對方' : p.role + ' #' + p.no + (p.name ? ' ' + p.name : '')) + '</td>' +
        '<td>' + (isTeam ? '–' : atk) + '</td><td>' + (isTeam ? '–' : blk) + '</td><td>' + (isTeam ? '–' : ace) + '</td>' +
        '<td>' + w.length + '</td><td>' + l.length + '</td>' +
        '<td class="' + (net > 0 ? 'pos' : net < 0 ? 'neg' : '') + '">' + (net > 0 ? '+' : '') + net + '</td></tr>';
    });
    const n = tot.w - tot.l;
    $('stats').innerHTML = '<thead><tr><th>球員</th><th>攻擊</th><th>攔網</th><th>發球</th><th>得分</th><th>失分</th><th>淨值</th></tr></thead><tbody>' + body +
      '</tbody><tfoot><tr><td>合計</td><td>' + tot.atk + '</td><td>' + tot.blk + '</td><td>' + tot.ace + '</td><td>' + tot.w + '</td><td>' + tot.l + '</td><td class="' + (n > 0 ? 'pos' : n < 0 ? 'neg' : '') + '">' + (n > 0 ? '+' : '') + n + '</td></tr></tfoot>';

    let bd = '';
    list.forEach(p => {
      const mine = evs.filter(e => e.pid === p.id);
      if (!mine.length) return;
      const counts = {};
      mine.forEach(e => { const key = e.type + '|' + e.k; counts[key] = (counts[key] || 0) + 1; });
      const tags = Object.entries(counts).sort((a, b) => (a[0] < b[0] ? 1 : -1) || b[1] - a[1]).map(([key, n]) => {
        const [type, k] = key.split('|');
        return '<span class="tag ' + (type === 'win' ? 'w' : 'l') + '">' + esc(LABELS[k] || k) + ' ×' + n + '</span>';
      }).join('');
      bd += '<div class="bd-row"><span class="who">' + esc(p.id === 'team' ? '團隊' : p.role + ' #' + p.no) + '</span><span class="bd-tags">' + tags + '</span></div>';
    });
    $('breakdown').innerHTML = bd || '<div class="empty">還沒有紀錄。點選球場上的球員開始記分。</div>';
  }

  function renderLog(c) {
    $('log-count').textContent = state.events.length + ' 球';
    if (!c.rows.length) { $('log').innerHTML = '<li class="empty" style="display:block">第一球記錄後會出現在這裡，最新的在最上面。</li>'; return; }
    let html = '';
    let lastSet = null;
    for (let i = c.rows.length - 1; i >= 0; i--) {
      const r = c.rows[i];
      if (r.set !== lastSet) {
        if (lastSet !== null) html += '<li class="setsep">第 ' + lastSet + ' 局 ↑</li>';
        lastSet = r.set;
      }
      const p = playerById(r.e.pid);
      html += '<li><span class="sc">' + r.us + ':' + r.them + '</span><span>' + esc(whoLabel(p)) + '・' + esc(LABELS[r.e.k] || r.e.k) + '</span><span class="mark ' + (r.e.type === 'win' ? 'w' : 'l') + '">' + (r.e.type === 'win' ? '+' : '−') + '</span></li>';
    }
    html += '<li class="setsep">第 ' + lastSet + ' 局 ↑</li>';
    $('log').innerHTML = html;
  }

  function actsHTML(groups) {
    return groups.map(gr => '<div class="grp">' + esc(gr.g) + '</div><div class="acts">' +
      gr.items.map(([k, l, h]) => '<button class="act" type="button" data-k="' + k + '">' + esc(l) + (h ? '<small>' + esc(h) + '</small>' : '') + '</button>').join('') + '</div>').join('');
  }

  function renderSheet() {
    const p = playerById(openId);
    const isTeam = openId === 'team';
    const acts = isTeam ? TEAM_ACTS : openId === 'l' ? LIBERO_ACTS : PLAYER_ACTS;
    const c = compute();
    const t = tallyFor(openId);
    const sheet = $('sheet');
    const prevFocus = document.activeElement && document.activeElement.id;
    sheet.innerHTML =
      '<div class="sheet-head">' +
        '<span class="disc"><span class="no">' + esc(isTeam ? '隊' : (p.no || '–')) + '</span>' + (isTeam ? '' : '<span class="role">' + esc(p.role) + '</span>') + '</span>' +
        '<div class="t"><strong id="sheet-title">' + esc(isTeam ? '團隊 / 對方' : (p.name ? p.name + '・' : '') + p.full) + '</strong>' +
        '<span>本場 +' + t.w + ' / −' + t.l + '・目前 ' + c.sets[c.sets.length - 1].us + ':' + c.sets[c.sets.length - 1].them + '</span></div>' +
        '<button class="x" type="button" id="close" aria-label="關閉">✕</button>' +
      '</div>' +
      (isTeam ? '' : '<div class="edit"><label>背號<input id="edit-no" maxlength="3" inputmode="numeric" value="' + esc(p.no) + '"></label><label>姓名<input id="edit-name" maxlength="12" placeholder="輸入球員姓名" value="' + esc(p.name) + '"></label></div>') +
      (c.matchOver ? '<div class="locked">比賽已結束。可以按「復原上一球」修正，或開始新比賽。</div>' :
      '<div class="cols">' +
        '<div class="col w"><h3>得分 <small>' + esc(state.teams.us) + ' +1</small></h3>' + actsHTML(acts.win).replace(/class="act"/g, 'class="act" data-type="win"') + '</div>' +
        '<div class="col l"><h3>失分 <small>' + esc(state.teams.them) + ' +1</small></h3>' + actsHTML(acts.lose).replace(/class="act"/g, 'class="act" data-type="lose"') + '</div>' +
      '</div>');
    if (prevFocus && $(prevFocus) && sheet.contains($(prevFocus))) $(prevFocus).focus();
  }

  function openSheet(id) {
    openId = id;
    renderSheet();
    $('scrim').hidden = false;
    $('sheet').hidden = false;
    $('close').focus();
  }
  function closeSheet() {
    const id = openId;
    openId = null;
    $('scrim').hidden = true;
    $('sheet').hidden = true;
    const b = document.querySelector('[data-pid="' + id + '"]');
    if (b) b.focus();
  }

  function record(type, k) {
    const before = compute();
    if (before.matchOver) return;
    state.events.push({ pid: openId, type, k, t: Date.now() });
    save();
    const p = playerById(openId);
    closeSheet();
    render();
    const after = compute();
    let msg = (type === 'win' ? '+1 ' : '−1 ') + whoLabel(p) + '・' + LABELS[k];
    if (after.sets.length > before.sets.length || after.matchOver) {
      const s = after.matchOver ? after.sets[after.sets.length - 1] : after.sets[after.sets.length - 2];
      msg = '第 ' + (after.matchOver ? after.sets.length : after.sets.length - 1) + ' 局結束 ' + s.us + ':' + s.them;
    }
    toast(msg, true);
  }

  function toast(msg, withUndo) {
    const el = $('toast');
    el.innerHTML = '<span>' + esc(msg) + '</span>' + (withUndo ? '<button type="button" id="toast-undo">復原</button>' : '');
    el.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.hidden = true; }, 3500);
  }

  function undo() {
    if (!state.events.length) return;
    const e = state.events.pop();
    save();
    render();
    toast('已復原：' + whoLabel(playerById(e.pid)) + '・' + LABELS[e.k], false);
  }

  // Events
  document.addEventListener('click', ev => {
    const pl = ev.target.closest('[data-pid]');
    if (pl) { openSheet(pl.dataset.pid); return; }
    const act = ev.target.closest('.act');
    if (act) { record(act.dataset.type, act.dataset.k); return; }
    if (ev.target.closest('#close') || ev.target === $('scrim')) { closeSheet(); return; }
    if (ev.target.closest('#toast-undo')) { undo(); return; }
    const sc = ev.target.closest('[data-scope]');
    if (sc) {
      scope = sc.dataset.scope;
      document.querySelectorAll('[data-scope]').forEach(b => b.setAttribute('aria-pressed', String(b === sc)));
      render();
    }
  });
  document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && openId) closeSheet(); });
  document.addEventListener('input', ev => {
    const id = ev.target.id;
    if (id === 'name-us' || id === 'name-them') {
      state.teams[id === 'name-us' ? 'us' : 'them'] = ev.target.value.trim() || (id === 'name-us' ? '我方' : '對方');
      save();
      return;
    }
    if ((id === 'edit-no' || id === 'edit-name') && openId && openId !== 'team') {
      const p = playerById(openId);
      if (id === 'edit-no') p.no = ev.target.value.trim();
      else p.name = ev.target.value.trim();
      save();
      renderCourt();
      renderStats(compute());
    }
  });
  document.addEventListener('change', ev => {
    if (ev.target.id === 'name-us' || ev.target.id === 'name-them') render();
  });

  $('undo').addEventListener('click', undo);
  $('swap-serve').addEventListener('click', () => { state.firstServe = state.firstServe === 'us' ? 'them' : 'us'; save(); render(); });
  $('best-of').addEventListener('change', ev => { state.bestOf = Number(ev.target.value); save(); render(); });

  let armTimer = null;
  $('reset').addEventListener('click', () => {
    const b = $('reset');
    if (!b.classList.contains('armed')) {
      b.classList.add('armed');
      b.textContent = '再按一次清除比分';
      clearTimeout(armTimer);
      armTimer = setTimeout(() => { b.classList.remove('armed'); b.textContent = '新比賽'; }, 3000);
      return;
    }
    clearTimeout(armTimer);
    b.classList.remove('armed');
    b.textContent = '新比賽';
    const keep = { teams: state.teams, players: state.players, bestOf: state.bestOf, firstServe: state.firstServe };
    state = { ...fresh(), ...keep, events: [] };
    save();
    render();
    toast('已開始新比賽（保留隊名與球員）', false);
  });

  window.vbScorer = { players: () => state.players, teams: () => state.teams };
  render();
})();
</script>
<script>
(function () {
  const SIM_KEY = 'vb-sim-v1';
  const NS = 'http://www.w3.org/2000/svg';
  const R = 0.46; // 球員圓圈半徑（公尺）

  // 5-1 陣容的第一輪站位：舉球 1 號位，大砲 2、5，攔中 3、6，背攻 4
  const LINEUP = [
    { id: 's', role: '舉球', rot: 1 }, { id: 'oh1', role: '大砲', rot: 2 }, { id: 'mb', role: '攔中', rot: 3 },
    { id: 'opp', role: '背攻', rot: 4 }, { id: 'oh2', role: '大砲', rot: 5 }, { id: 'mb2', role: '攔中', rot: 6 }
  ];
  const OPP_NO = { s: '6', oh1: '10', mb: '2', opp: '8', oh2: '11', mb2: '5' };
  // 基本站位（球員自己的視角：lx 從自己左邊算起，d 為離網距離）
  const BASE = { 1: [7.5, 6.5], 2: [7.5, 1.8], 3: [4.5, 1.8], 4: [1.5, 1.8], 5: [1.5, 6.5], 6: [4.5, 7.2] };
  const FRONT = [2, 3, 4];

  const ROUTE_W = { cross: 0.28, line: 0.2, seam: 0.15, tip: 0.15, sharp: 0.12, tool: 0.1 };
  const OUT = {
    blocked: { label: '被攔網', p: 0.12 },
    dig: { label: '可防起', p: 0.3 },
    hard: { label: '勉強救', p: 0.6 },
    gap: { label: '空檔', p: 0.9 },
    tool: { label: '打手出界', p: 0.85 }
  };

  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const other = t => (t === 'us' ? 'them' : 'us');
  const toWorld = (team, lx, d) => (team === 'us' ? [lx, 9 + d] : [9 - lx, 9 - d]);
  const toLocal = (team, x, y) => (team === 'us' ? [x, y - 9] : [9 - x, 9 - y]);
  const teamName = t => { const n = window.vbScorer && window.vbScorer.teams(); return n ? n[t] : (t === 'us' ? '我方' : '對方'); };

  function makePlayers() {
    const out = [];
    ['us', 'them'].forEach(team => LINEUP.forEach(p => {
      const [x, y] = toWorld(team, ...BASE[p.rot]);
      out.push({ key: team + '-' + p.id, team, id: p.id, role: p.role, rot: p.rot, x, y });
    }));
    return out;
  }
  function fresh() {
    return { attack: 'them', heat: true, shadow: true, selected: 'them-oh1', players: makePlayers(), tally: { n: 0, att: 0, def: 0, byRoute: {} } };
  }
  let sim = (function () {
    try {
      const s = JSON.parse(localStorage.getItem(SIM_KEY));
      if (s && Array.isArray(s.players) && s.players.length === 12) return { ...fresh(), ...s };
    } catch (e) {}
    return fresh();
  })();
  const save = () => { try { localStorage.setItem(SIM_KEY, JSON.stringify(sim)); } catch (e) {} };

  function numberOf(p) {
    if (p.team === 'them') return OPP_NO[p.id];
    const list = window.vbScorer && window.vbScorer.players();
    const me = list && list.find(x => x.id === p.id);
    return me && me.no ? me.no : '–';
  }
  const depthOf = p => Math.abs(p.y - 9);
  const isFrontRot = p => FRONT.includes(p.rot);

  function attacker() {
    let a = sim.players.find(p => p.key === sim.selected && p.team === sim.attack);
    if (!a) {
      const mine = sim.players.filter(p => p.team === sim.attack && isFrontRot(p));
      a = mine.find(p => p.role === '大砲') || mine[0];
      sim.selected = a.key;
    }
    return a;
  }

  function zoneOf(team, x, y) {
    const [lx, d] = toLocal(team, x, y);
    const col = lx < 3 ? 0 : lx < 6 ? 1 : 2;
    return d < 3 ? [4, 3, 2][col] : [5, 6, 1][col];
  }

  // 主分析：球路、攔網、防守距離
  function analyse() {
    const A = sim.attack, D = other(A);
    const att = attacker();
    const dirD = D === 'us' ? 1 : -1;
    const attDepth = Math.max(depthOf(att), 0.4);
    const C = { x: att.x, y: 9 - dirD * attDepth };
    const defenders = sim.players.filter(p => p.team === D);
    const blockers = defenders.filter(p => depthOf(p) <= 1.2 && p.x > -0.6 && p.x < 9.6);
    const diggers = defenders.filter(p => !blockers.includes(p));

    // 攔網手範圍，相鄰的合併成一道牆
    const raw = blockers.map(b => [b.x - 0.55, b.x + 0.55]).sort((a, b) => a[0] - b[0]);
    const segs = [];
    raw.forEach(s => { const last = segs[segs.length - 1]; if (last && s[0] <= last[1] + 0.05) last[1] = Math.max(last[1], s[1]); else segs.push(s.slice()); });

    const crossX = (tx, ty) => C.x + (9 - C.y) / (ty - C.y) * (tx - C.x);
    const inShadow = (x, y) => { const xc = crossX(x, y); return segs.some(([a, b]) => xc >= a && xc <= b); };
    const nearest = (list, x, y) => list.reduce((m, p) => Math.min(m, Math.hypot(p.x - x, p.y - y)), Infinity);

    const front = attDepth <= 3.5;
    const xa = C.x, L = xa < 4.5, mid = Math.abs(xa - 4.5) < 1.2;
    const defs = [
      { k: 'cross', label: '斜線', tx: L ? 7.6 : 1.4, d: 7.4 },
      { k: 'line', label: '直線', tx: mid ? clamp(xa, 0.8, 8.2) : (L ? 0.7 : 8.3), d: 8.2 },
      { k: 'seam', label: '中路', tx: 4.5 + (L ? 0.9 : -0.9), d: 5.4 }
    ];
    if (front) {
      defs.push({ k: 'sharp', label: '小斜線', tx: L ? 8.4 : 0.6, d: 3.2 });
      defs.push({ k: 'tip', label: '吊球', tx: clamp(xa + (L ? 1.3 : -1.3), 0.5, 8.5), d: 1.6 });
    }
    const facing = segs.some(([a, b]) => xa >= a - 0.6 && xa <= b + 0.6);
    if (facing) defs.push({ k: 'tool', label: '打手出界', tx: L ? -1.3 : 10.3, d: 3 });

    const routes = defs.map(r => {
      const tx = r.tx, ty = 9 + dirD * r.d;
      let outcome, dist = null;
      if (r.k === 'tool') outcome = 'tool';
      else if (r.k !== 'tip' && inShadow(tx, ty)) outcome = 'blocked';
      else {
        dist = nearest(r.k === 'tip' ? defenders : diggers, tx, ty);
        outcome = dist <= 1.6 ? 'dig' : dist <= 2.6 ? 'hard' : 'gap';
      }
      return { ...r, tx, ty, outcome, dist, w: ROUTE_W[r.k], p: OUT[outcome].p, zone: r.k === 'tool' ? '界外' : zoneOf(D, tx, ty) + ' 號區' };
    });
    const wsum = routes.reduce((s, r) => s + r.w, 0);
    const rate = routes.reduce((s, r) => s + r.w * r.p, 0) / wsum;

    // 空檔熱區（0.5 公尺格）
    const heat = [];
    let gap = null;
    for (let lx = 0.25; lx < 9; lx += 0.5) {
      for (let d = 0.25; d < 9; d += 0.5) {
        const [x, y] = toWorld(D, lx, d);
        const shaded = inShadow(x, y) && d > 1;
        let dd = nearest(d < 2 ? defenders : diggers, x, y);
        if (shaded) dd *= 0.4;
        heat.push({ x, y, v: dd });
        if (d >= 1.5 && (!gap || dd > gap.v)) gap = { x, y, v: dd, raw: nearest(diggers, x, y) };
      }
    }

    // 攔網陰影多邊形
    const yEnd = 9 + dirD * 9;
    const shadows = segs.map(([a, b]) => {
      const t = (yEnd - C.y) / (9 - C.y);
      return [[a, 9], [b, 9], [C.x + t * (b - C.x), yEnd], [C.x + t * (a - C.x), yEnd]];
    });

    return { A, D, att, C, front, blockers, diggers, routes, rate, heat, gap, shadows, segs, L };
  }

  function el(tag, attrs, text) {
    const n = document.createElementNS(NS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    if (text != null) n.textContent = text;
    return n;
  }

  function drawStatic(svg) {
    svg.innerHTML = '';
    const defs = el('defs', {});
    const cp = el('clipPath', { id: 'sv-clip' });
    cp.appendChild(el('rect', { x: 0, y: 0, width: 9, height: 18 }));
    defs.appendChild(cp);
    svg.appendChild(defs);
    svg.appendChild(el('rect', { class: 'sv-free', x: -2.2, y: -1.6, width: 13.4, height: 21.2 }));
    svg.appendChild(el('rect', { class: 'sv-court', x: 0, y: 0, width: 9, height: 18 }));
    const g = el('g', {});
    for (let i = 1; i < 9; i++) g.appendChild(el('line', { class: 'sv-grid', x1: i, y1: 0, x2: i, y2: 18 }));
    for (let i = 1; i < 18; i++) if (i !== 9) g.appendChild(el('line', { class: 'sv-grid', x1: 0, y1: i, x2: 9, y2: i }));
    // 每邊 6 個區：前場 3 公尺、後場 6 公尺
    ['us', 'them'].forEach(team => {
      [[4, 0, 0], [3, 3, 0], [2, 6, 0], [5, 0, 3], [6, 3, 3], [1, 6, 3]].forEach(([no, lx, d]) => {
        const h = d === 0 ? 3 : 6;
        const [x1, y1] = toWorld(team, lx, d), [x2, y2] = toWorld(team, lx + 3, d + h);
        const x = Math.min(x1, x2), y = Math.min(y1, y2);
        g.appendChild(el('rect', { class: 'sv-zone', x, y, width: 3, height: h }));
        g.appendChild(el('text', { class: 'sv-zno', x: x + 1.5, y: y + h / 2 }, no));
      });
    });
    svg.appendChild(g);
    svg.appendChild(el('rect', { class: 'sv-line', x: 0, y: 0, width: 9, height: 18 }));
    [6, 12].forEach(y => svg.appendChild(el('line', { class: 'sv-line', x1: 0, y1: y, x2: 9, y2: y })));
    // 尺寸標示
    [[7.5, '3m 前場'], [3, '6m 後場'], [10.5, '3m 前場'], [15, '6m 後場']].forEach(([y, t]) => {
      svg.appendChild(el('text', { class: 'sv-dim', x: -1.1, y, transform: 'rotate(-90 -1.1 ' + y + ')' }, t));
    });
    svg.appendChild(el('text', { class: 'sv-dim', x: 4.5, y: 18.55 }, '9m'));
    svg.appendChild(el('text', { class: 'sv-side', x: 4.5, y: -0.9, id: 'sv-name-them' }, ''));
    svg.appendChild(el('text', { class: 'sv-side', x: 4.5, y: 19.1, id: 'sv-name-us' }, ''));
    ['heat', 'shadow', 'routes', 'players', 'fx'].forEach(id => {
      const layer = el('g', { id: 'sv-' + id });
      if (id === 'heat' || id === 'shadow') layer.setAttribute('clip-path', 'url(#sv-clip)');
      svg.appendChild(layer);
      if (id === 'shadow') {
        svg.appendChild(el('line', { class: 'sv-net', x1: -0.6, y1: 9, x2: 9.6, y2: 9 }));
        [0, 9].forEach(x => svg.appendChild(el('line', { class: 'sv-ant', x1: x, y1: 8.6, x2: x, y2: 9.4 })));
      }
    });
  }

  let last = null;

  function render() {
    const svg = $('sim-svg');
    if (!svg.firstChild) drawStatic(svg);
    const a = analyse();
    last = a;
    $('sv-name-them').textContent = teamName('them') + (a.A === 'them' ? '（進攻）' : '（防守）');
    $('sv-name-us').textContent = teamName('us') + (a.A === 'us' ? '（進攻）' : '（防守）');

    const heat = $('sv-heat');
    heat.innerHTML = '';
    if (sim.heat) a.heat.forEach(c => {
      const o = clamp((c.v - 1.6) / 2.4, 0, 0.6);
      if (o > 0.02) heat.appendChild(el('rect', { class: 'sv-heat', x: c.x - 0.25, y: c.y - 0.25, width: 0.5, height: 0.5, opacity: o.toFixed(2) }));
    });

    const sh = $('sv-shadow');
    sh.innerHTML = '';
    if (sim.shadow) a.shadows.forEach(pts => sh.appendChild(el('polygon', { class: 'sv-shadow', points: pts.map(p => p.join(',')).join(' ') })));

    const rt = $('sv-routes');
    rt.innerHTML = '';
    a.routes.forEach(r => {
      rt.appendChild(el('line', { class: 'sv-route ' + r.outcome, x1: a.C.x, y1: a.C.y, x2: r.tx, y2: r.ty }));
      rt.appendChild(el('circle', { class: 'sv-end ' + r.outcome, cx: r.tx, cy: r.ty, r: 0.17 }));
      const ly = r.ty + (a.D === 'us' ? 0.5 : -0.3);
      rt.appendChild(el('text', { class: 'sv-rlabel', x: clamp(r.tx, -1.4, 10.4), y: ly }, r.label));
    });
    if (a.gap && a.gap.raw > 2.2) {
      rt.appendChild(el('circle', { class: 'sv-gapmark', cx: a.gap.x, cy: a.gap.y, r: 0.7 }));
      rt.appendChild(el('text', { class: 'sv-gaptxt', x: a.gap.x, y: a.gap.y + 0.1 }, '空檔'));
    }

    const pl = $('sv-players');
    pl.innerHTML = '';
    sim.players.forEach(p => {
      const g = el('g', { class: 'sv-p ' + p.team + (p.key === a.att.key ? ' pick' : ''), 'data-key': p.key, tabindex: 0, role: 'button',
        'aria-label': (p.team === 'us' ? teamName('us') : teamName('them')) + ' ' + p.role + ' ' + numberOf(p) + ' 號，' + p.rot + ' 號位，方向鍵移動', transform: 'translate(' + p.x.toFixed(2) + ' ' + p.y.toFixed(2) + ')' });
      g.appendChild(el('circle', { class: 'sv-hit', r: R + 0.25 }));
      g.appendChild(el('circle', { class: 'sv-disc', r: R }));
      g.appendChild(el('text', { class: 'sv-no', y: -0.02 }, numberOf(p)));
      g.appendChild(el('text', { class: 'sv-role', y: R + 0.3 }, p.role + ' ' + p.rot));
      pl.appendChild(g);
    });
    if (dragKey) { const n = pl.querySelector('[data-key="' + dragKey + '"]'); if (n) pl.appendChild(n); }

    renderPanel(a);
  }

  function renderPanel(a) {
    document.querySelectorAll('[data-attack]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.attack === sim.attack)));
    $('sim-heat').checked = sim.heat;
    $('sim-shadow').checked = sim.shadow;
    const atkName = teamName(a.A), defName = teamName(a.D);
    $('sim-hint').textContent = '拖曳' + atkName + '的攻擊手（黃色外框），會畫出他可能的球路；拖曳' + defName + '的球員，可以調整攔網和防守位置。';
    $('sim-attacker').textContent = atkName + ' ' + a.att.role + ' #' + numberOf(a.att) + (a.front ? '・前排攻擊' : '・後排攻擊');
    const rotOf = t => sim.players.find(p => p.team === t && p.id === 's').rot;
    $('sim-rot').textContent = '舉球位置：' + teamName('us') + ' ' + rotOf('us') + ' 號位・' + teamName('them') + ' ' + rotOf('them') + ' 號位';

    const pct = Math.round(a.rate * 100);
    const big = $('sim-rate');
    big.textContent = pct + '%';
    big.className = 'big ' + (pct >= 60 ? 'hi' : pct >= 40 ? 'mid' : 'lo');
    $('sim-rate-txt').textContent = atkName + '這一攻的預估得分率（依各球路常見比例加權）。' + (a.blockers.length ? defName + '目前 ' + a.blockers.length + ' 人攔網。' : defName + '沒有人在網前攔網。');

    $('sim-routes').innerHTML = '<thead><tr><th>球路</th><th>落點</th><th>常見比例</th><th>判定</th><th>得分率</th></tr></thead><tbody>' +
      a.routes.map(r => '<tr><td>' + esc(r.label) + '</td><td>' + esc(r.zone) + '</td><td>' + Math.round(r.w * 100) + '%</td><td><span class="oc ' + r.outcome + '">' + OUT[r.outcome].label + (r.dist != null ? ' ' + r.dist.toFixed(1) + 'm' : '') + '</span></td><td>' + Math.round(r.p * 100) + '%</td></tr>').join('') + '</tbody>';

    const tips = [];
    const weak = a.routes.filter(r => r.outcome === 'gap');
    if (!a.blockers.length && a.front) tips.push('網前沒有攔網手：把攔中或' + (a.L ? '左' : '右') + '邊的前排拖到攻擊手正前方、離網 1 公尺內。');
    if (a.blockers.length === 1 && a.front) tips.push('只有單人攔網，再補一位前排並肩攔，可以把陰影變寬。');
    weak.forEach(r => tips.push(r.label + '落在' + r.zone + '沒人守，最近的防守者也在 ' + r.dist.toFixed(1) + ' 公尺外。'));
    if (a.routes.some(r => r.k === 'tool')) tips.push('攔網手正對攻擊手，小心打手出界：外側攔網手的手要往場內轉。');
    if (a.routes.some(r => r.k === 'tip' && r.outcome !== 'dig')) tips.push('吊球區沒人補，讓沒攔網的前排退到 3 公尺線附近。');
    if (a.gap && a.gap.raw > 2.2) tips.push('最大空檔在' + zoneOf(a.D, a.gap.x, a.gap.y) + ' 號區（黃色虛線圈），距離最近的防守者 ' + a.gap.raw.toFixed(1) + ' 公尺。');
    if (!tips.length) tips.push('這個站位守得不錯：主要球路都有人或有攔網陰影覆蓋。');
    tips.push('不知道怎麼站？按「自動排防守站位」，會依攻擊手位置排出雙人攔網加邊線防守。');
    $('sim-advice').innerHTML = tips.map(t => '<li>' + esc(t) + '</li>').join('');

    renderTally();
  }

  function renderTally() {
    const t = sim.tally;
    $('sim-count').textContent = t.n ? '已模擬 ' + t.n + ' 球' : '';
    if (!t.n) { $('sim-tally').innerHTML = ''; return; }
    const rows = Object.entries(t.byRoute).sort((x, y) => (y[1].att + y[1].def) - (x[1].att + x[1].def)).map(([k, v]) =>
      '<div class="bd-row"><span class="who">' + esc(v.label) + '</span><span class="bd-tags"><span class="tag l">進攻得分 ×' + v.att + '</span><span class="tag w">守住 ×' + v.def + '</span></span></div>').join('');
    $('sim-tally').innerHTML = '<div class="bd-row"><span class="who">合計</span><span class="bd-tags"><span class="tag l">進攻得分 ' + t.att + '（' + Math.round(t.att / t.n * 100) + '%）</span><span class="tag w">防守守住 ' + t.def + '</span></span></div>' + rows;
  }

  function pickRoute(routes) {
    const sum = routes.reduce((s, r) => s + r.w, 0);
    let x = Math.random() * sum;
    for (const r of routes) { x -= r.w; if (x <= 0) return r; }
    return routes[routes.length - 1];
  }

  function play(a) {
    const r = pickRoute(a.routes);
    const scored = Math.random() < r.p;
    const t = sim.tally;
    t.n++;
    scored ? t.att++ : t.def++;
    const b = t.byRoute[r.k] || (t.byRoute[r.k] = { label: r.label, att: 0, def: 0 });
    scored ? b.att++ : b.def++;
    return { r, scored };
  }

  function describe(a, res) {
    const atk = teamName(a.A), def = teamName(a.D);
    const { r, scored } = res;
    let how;
    if (r.outcome === 'blocked') how = scored ? '攔網沒攔死，球彈落在' + r.zone : '被攔網擋下';
    else if (r.outcome === 'tool') how = scored ? '打到攔網手出界' : '打手出界，但判定沒碰到手，出界';
    else how = '落在' + r.zone + (scored ? '，' + def + '沒救起' : '，' + def + '防起反擊');
    return '<strong>' + esc(atk + '・' + r.label) + '</strong>：' + esc(how) + ' → <strong style="color:var(' + (scored ? '--lose' : '--win') + ')">' + esc((scored ? atk : def) + '得分') + '</strong>';
  }

  let animating = false;
  function simulateOne() {
    if (animating) return;
    const a = analyse();
    const res = play(a);
    save();
    const fx = $('sv-fx');
    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const finish = () => { animating = false; $('sim-result').innerHTML = describe(a, res); renderTally(); };
    if (reduce) { finish(); return; }
    animating = true;
    fx.innerHTML = '';
    const ball = el('circle', { class: 'sv-ball', cx: a.C.x, cy: a.C.y, r: 0.22 });
    fx.appendChild(ball);
    const r = res.r;
    const dur = r.k === 'tip' ? 750 : 520;
    // 被攔網的球停在網上再彈回
    const stopT = r.outcome === 'blocked' && !res.scored ? (9 - a.C.y) / (r.ty - a.C.y) : 1;
    const t0 = performance.now();
    (function step(now) {
      const k = Math.min(1, (now - t0) / dur);
      let u = k * stopT;
      let x = a.C.x + (r.tx - a.C.x) * u, y = a.C.y + (r.ty - a.C.y) * u;
      const lift = r.k === 'tip' ? Math.sin(Math.PI * k) * 0.18 : Math.sin(Math.PI * k) * 0.08;
      ball.setAttribute('cx', x.toFixed(3));
      ball.setAttribute('cy', y.toFixed(3));
      ball.setAttribute('r', (0.22 + lift).toFixed(3));
      if (k < 1) requestAnimationFrame(step);
      else { setTimeout(() => { if (ball.parentNode) ball.remove(); }, 900); finish(); }
    })(t0);
  }

  // 自動防守：雙人攔網 + 不攔網的前排退 3 公尺線 + 後排邊線防守
  function autoDefense() {
    const a = analyse();
    const D = a.D;
    const [lxa] = toLocal(D, a.C.x, a.C.y);
    const L = lxa < 4.5;
    const inner = clamp(lxa + (L ? 0.55 : -0.55), 1, 8);
    const outer = clamp(lxa + (L ? -0.55 : 0.55), 0.5, 8.5);
    const spots = L
      ? { 4: [outer, 0.6], 3: [inner, 0.6], 2: [7.4, 3.2], 5: [0.9, 7], 6: [4.5, 8.2], 1: [7.8, 6] }
      : { 2: [outer, 0.6], 3: [inner, 0.6], 4: [1.6, 3.2], 1: [8.1, 7], 6: [4.5, 8.2], 5: [1.2, 6] };
    if (!a.front) { // 後排攻擊：攔網退一點，防守拉深
      Object.keys(spots).forEach(k => { if (FRONT.includes(+k) && spots[k][1] < 1) spots[k][1] = 0.8; });
    }
    sim.players.filter(p => p.team === D).forEach(p => { [p.x, p.y] = toWorld(D, ...spots[p.rot]); });
    save();
    render();
  }

  function basePositions() {
    sim.players.forEach(p => { [p.x, p.y] = toWorld(p.team, ...BASE[p.rot]); });
    save();
    render();
  }

  function rotate(team) {
    // 順時針輪轉：2→1、1→6、6→5、5→4、4→3、3→2
    sim.players.filter(p => p.team === team).forEach(p => {
      p.rot = p.rot === 1 ? 6 : p.rot - 1;
      [p.x, p.y] = toWorld(team, ...BASE[p.rot]);
    });
    const sel = sim.players.find(p => p.key === sim.selected);
    if (sel && sel.team === team && !isFrontRot(sel)) sim.selected = '';
    attacker();
    save();
    render();
  }

  // 拖曳
  let dragKey = null, dragOff = [0, 0];
  function svgPoint(svg, e) {
    const pt = svg.createSVGPoint();
    pt.x = e.clientX; pt.y = e.clientY;
    const m = svg.getScreenCTM();
    return m ? pt.matrixTransform(m.inverse()) : { x: 0, y: 0 };
  }
  function place(p, x, y) {
    p.x = clamp(x, -1.7, 10.7);
    p.y = p.team === 'us' ? clamp(y, 9 + R * 0.6, 19.2) : clamp(y, -1.2, 9 - R * 0.6);
  }

  function bind() {
    const svg = $('sim-svg');
    svg.addEventListener('pointerdown', e => {
      const g = e.target.closest('[data-key]');
      if (!g) return;
      const p = sim.players.find(x => x.key === g.dataset.key);
      dragKey = p.key;
      const pt = svgPoint(svg, e);
      dragOff = [p.x - pt.x, p.y - pt.y];
      if (p.team === sim.attack) sim.selected = p.key;
      try { svg.setPointerCapture(e.pointerId); } catch (err) {}
      e.preventDefault();
      render();
    });
    svg.addEventListener('pointermove', e => {
      if (!dragKey) return;
      const p = sim.players.find(x => x.key === dragKey);
      const pt = svgPoint(svg, e);
      place(p, pt.x + dragOff[0], pt.y + dragOff[1]);
      render();
    });
    const end = () => { if (dragKey) { dragKey = null; save(); render(); } };
    svg.addEventListener('pointerup', end);
    svg.addEventListener('pointercancel', end);
    svg.addEventListener('keydown', e => {
      const g = e.target.closest('[data-key]');
      if (!g) return;
      const p = sim.players.find(x => x.key === g.dataset.key);
      const step = e.shiftKey ? 1 : 0.25;
      const mv = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] }[e.key];
      if (mv) { place(p, p.x + mv[0], p.y + mv[1]); }
      else if (e.key === 'Enter' || e.key === ' ') { if (p.team === sim.attack) sim.selected = p.key; }
      else return;
      e.preventDefault();
      save();
      render();
      const again = svg.querySelector('[data-key="' + p.key + '"]');
      if (again) again.focus();
    });

    document.querySelectorAll('[data-attack]').forEach(b => b.addEventListener('click', () => {
      sim.attack = b.dataset.attack;
      sim.selected = '';
      attacker();
      save();
      render();
    }));
    $('sim-heat').addEventListener('change', e => { sim.heat = e.target.checked; save(); render(); });
    $('sim-shadow').addEventListener('change', e => { sim.shadow = e.target.checked; save(); render(); });
    $('sim-auto').addEventListener('click', autoDefense);
    $('sim-base').addEventListener('click', basePositions);
    $('sim-rot-us').addEventListener('click', () => rotate('us'));
    $('sim-rot-them').addEventListener('click', () => rotate('them'));
    $('sim-one').addEventListener('click', simulateOne);
    $('sim-100').addEventListener('click', () => {
      const a = analyse();
      for (let i = 0; i < 100; i++) play(a);
      save();
      const t = sim.tally;
      $('sim-result').innerHTML = '連續模擬 100 球完成。累計 ' + t.n + ' 球中，' + esc(teamName(a.A)) + '進攻得分 ' + t.att + ' 球。';
      renderTally();
    });
    $('sim-clear').addEventListener('click', () => {
      sim.tally = { n: 0, att: 0, def: 0, byRoute: {} };
      save();
      $('sim-result').textContent = '統計已清除。';
      renderTally();
    });
  }

  // 分頁切換
  function show(view) {
    $('view-score').hidden = view !== 'score';
    $('view-sim').hidden = view !== 'sim';
    document.querySelectorAll('[data-view]').forEach(b => b.setAttribute('aria-selected', String(b.dataset.view === view)));
    if (view === 'sim') render();
    try { localStorage.setItem('vb-view', view); } catch (e) {}
  }
  document.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => show(b.dataset.view)));

  bind();
  let start = 'score';
  try { start = localStorage.getItem('vb-view') || 'score'; } catch (e) {}
  if (location.hash === '#sim') start = 'sim';
  show(start === 'sim' ? 'sim' : 'score');
})();
</script>
